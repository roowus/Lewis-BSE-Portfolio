<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" role="img" aria-label="Smart Glasses system architecture">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
    <style>
      .title { font: 700 26px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #64748b; }
      .col { font: 700 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #0f172a; }
      .h { font: 700 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #0f172a; }
      .p { font: 400 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #475569; }
      .edge { font: 700 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #0f172a; }
      .foot { font: 400 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect width="1240" height="820" fill="#ffffff"/>
  <text x="40" y="44" class="title">Smart Glasses System Architecture</text>
  <text x="40" y="70" class="subtitle">Capture on the glasses, compute in the pocket, AI on the Mac</text>

  <!-- Three swimlanes -->
  <rect x="40" y="100" width="320" height="640" rx="20" fill="#f8fbff" stroke="#dbeafe"/>
  <rect x="460" y="100" width="320" height="640" rx="20" fill="#f7fdf9" stroke="#dcfce7"/>
  <rect x="880" y="100" width="320" height="640" rx="20" fill="#fffdf7" stroke="#fef3c7"/>

  <!-- Headers -->
  <rect x="70" y="124" width="260" height="48" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="200" y="154" text-anchor="middle" class="col">1. Glasses</text>

  <rect x="490" y="124" width="260" height="48" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="620" y="154" text-anchor="middle" class="col">2. Pocket</text>

  <rect x="910" y="124" width="260" height="48" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="1040" y="154" text-anchor="middle" class="col">3. Mac (Jarbis)</text>

  <!-- Glasses stack -->
  <rect x="80" y="210" width="240" height="86" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="200" y="246" text-anchor="middle" class="h">OV5647 Camera</text>
  <text x="200" y="270" text-anchor="middle" class="p">In CAD camera holder</text>

  <rect x="80" y="340" width="240" height="86" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="200" y="376" text-anchor="middle" class="h">Jieli Lav Mic</text>
  <text x="200" y="400" text-anchor="middle" class="p">Questions and commands</text>

  <rect x="80" y="560" width="240" height="86" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="200" y="596" text-anchor="middle" class="h">Earpiece</text>
  <text x="200" y="620" text-anchor="middle" class="p">Spoken AI replies</text>

  <!-- Pocket stack -->
  <rect x="500" y="275" width="240" height="120" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="620" y="320" text-anchor="middle" class="h">Raspberry Pi 4</text>
  <text x="620" y="346" text-anchor="middle" class="p">+ USB power bank</text>
  <text x="620" y="370" text-anchor="middle" class="p">Streams A/V, plays TTS</text>

  <rect x="500" y="560" width="240" height="86" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="620" y="596" text-anchor="middle" class="h">Phone</text>
  <text x="620" y="620" text-anchor="middle" class="p">KDE Connect share target</text>

  <!-- Mac stack -->
  <rect x="920" y="200" width="240" height="70" rx="14" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="1040" y="242" text-anchor="middle" class="h">Video Receiver</text>

  <rect x="920" y="300" width="240" height="70" rx="14" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="1040" y="342" text-anchor="middle" class="h">VAD + Whisper STT</text>

  <rect x="920" y="400" width="240" height="70" rx="14" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="1040" y="442" text-anchor="middle" class="h">Ollama llava-phi3</text>

  <rect x="920" y="500" width="240" height="70" rx="14" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="1040" y="542" text-anchor="middle" class="h">macOS say TTS</text>

  <rect x="920" y="600" width="240" height="70" rx="14" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="1040" y="642" text-anchor="middle" class="h">KDE Actions</text>

  <!-- Mac internal flow -->
  <line x1="1040" y1="270" x2="1040" y2="300" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1040" y1="370" x2="1040" y2="400" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1040" y1="470" x2="1040" y2="500" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1040" y1="570" x2="1040" y2="600" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Corridor labels sit in gutters between columns only -->

  <!-- Camera to Pi: y=253 -->
  <path d="M 320 253 H 380 V 310 H 500" fill="none" stroke="#0f172a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="352" y="276" width="76" height="22" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="390" y="292" text-anchor="middle" class="edge">long flex</text>

  <!-- Mic to Pi: y=383 -->
  <path d="M 320 383 H 500" fill="none" stroke="#0f172a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="352" y="360" width="76" height="22" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="390" y="376" text-anchor="middle" class="edge">USB mic</text>

  <!-- Pi to earpiece: down left corridor -->
  <path d="M 500 395 H 400 V 603 H 320" fill="none" stroke="#0f172a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="352" y="470" width="76" height="22" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="390" y="486" text-anchor="middle" class="edge">audio out</text>

  <!-- Pi to Mac video -->
  <path d="M 740 300 H 800 V 235 H 920" fill="none" stroke="#0f172a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="770" y="250" width="84" height="22" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="812" y="266" text-anchor="middle" class="edge">UDP 5004</text>

  <!-- Pi to Mac mic -->
  <path d="M 740 335 H 920" fill="none" stroke="#0f172a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="770" y="312" width="84" height="22" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="812" y="328" text-anchor="middle" class="edge">UDP 5006</text>

  <!-- Mac TTS back to Pi -->
  <path d="M 920 535 H 820 V 380 H 740" fill="none" stroke="#0f172a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="770" y="430" width="84" height="22" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="812" y="446" text-anchor="middle" class="edge">UDP 5008</text>

  <!-- KDE actions to phone -->
  <path d="M 920 635 H 740" fill="none" stroke="#0f172a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="770" y="612" width="84" height="22" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="812" y="628" text-anchor="middle" class="edge">share file</text>

  <text x="40" y="780" class="foot">Only the camera, mic, and earpiece sit on the glasses. The Pi and powerbank stay in a pocket.</text>
</svg>
