<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-label="Smart Glasses system architecture">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 22px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; fill: #0f172a; }
      .subtitle { font: 600 14px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; fill: #334155; }
      .label { font: 600 15px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; fill: #0f172a; }
      .small { font: 13px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; fill: #334155; }
      .tiny { font: 12px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; fill: #475569; }
      .edge { font: 600 12px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; fill: #1e293b; }
      .box { stroke-width: 2; filter: url(#shadow); }
    </style>
  </defs>

  <rect width="1100" height="620" fill="#f8fafc"/>
  <text x="40" y="40" class="title">Smart Glasses System Architecture</text>
  <text x="40" y="64" class="subtitle">Wearable capture on the glasses and Pi, AI brain on the Mac</text>

  <!-- Column headers -->
  <rect x="40" y="90" width="300" height="40" rx="10" fill="#dbeafe" stroke="#2563eb" class="box"/>
  <text x="190" y="115" text-anchor="middle" class="label">Glasses (on face)</text>

  <rect x="400" y="90" width="300" height="40" rx="10" fill="#dcfce7" stroke="#16a34a" class="box"/>
  <text x="550" y="115" text-anchor="middle" class="label">Pocket</text>

  <rect x="760" y="90" width="300" height="40" rx="10" fill="#fef3c7" stroke="#d97706" class="box"/>
  <text x="910" y="115" text-anchor="middle" class="label">Mac (Jarbis)</text>

  <!-- Glasses nodes -->
  <rect x="55" y="160" width="270" height="70" rx="12" fill="#ffffff" stroke="#2563eb" class="box"/>
  <text x="190" y="190" text-anchor="middle" class="label">OV5647 Camera</text>
  <text x="190" y="212" text-anchor="middle" class="tiny">in CAD camera holder</text>

  <rect x="55" y="255" width="270" height="70" rx="12" fill="#ffffff" stroke="#2563eb" class="box"/>
  <text x="190" y="285" text-anchor="middle" class="label">Jieli Wireless Lav Mic</text>
  <text x="190" y="307" text-anchor="middle" class="tiny">voice questions and commands</text>

  <rect x="55" y="350" width="270" height="70" rx="12" fill="#ffffff" stroke="#2563eb" class="box"/>
  <text x="190" y="380" text-anchor="middle" class="label">Earpiece / Speakers</text>
  <text x="190" y="402" text-anchor="middle" class="tiny">hears spoken AI replies</text>

  <!-- Pocket node -->
  <rect x="415" y="230" width="270" height="130" rx="12" fill="#ffffff" stroke="#16a34a" class="box"/>
  <text x="550" y="275" text-anchor="middle" class="label">Raspberry Pi 4</text>
  <text x="550" y="300" text-anchor="middle" class="small">+ USB power bank</text>
  <text x="550" y="325" text-anchor="middle" class="tiny">streams video/audio, plays TTS,</text>
  <text x="550" y="343" text-anchor="middle" class="tiny">runs KDE Connect actions</text>

  <!-- Mac nodes -->
  <rect x="775" y="160" width="270" height="58" rx="12" fill="#ffffff" stroke="#d97706" class="box"/>
  <text x="910" y="195" text-anchor="middle" class="label">video_receiver.py</text>

  <rect x="775" y="235" width="270" height="58" rx="12" fill="#ffffff" stroke="#d97706" class="box"/>
  <text x="910" y="270" text-anchor="middle" class="label">VAD + faster-whisper STT</text>

  <rect x="775" y="310" width="270" height="58" rx="12" fill="#ffffff" stroke="#d97706" class="box"/>
  <text x="910" y="345" text-anchor="middle" class="label">Ollama llava-phi3</text>

  <rect x="775" y="385" width="270" height="58" rx="12" fill="#ffffff" stroke="#d97706" class="box"/>
  <text x="910" y="420" text-anchor="middle" class="label">macOS say TTS</text>

  <rect x="775" y="460" width="270" height="58" rx="12" fill="#ffffff" stroke="#d97706" class="box"/>
  <text x="910" y="495" text-anchor="middle" class="label">KDE photo / record actions</text>

  <!-- Phone -->
  <rect x="415" y="460" width="270" height="58" rx="12" fill="#ffffff" stroke="#7c3aed" class="box"/>
  <text x="550" y="495" text-anchor="middle" class="label">Phone (KDE Connect)</text>

  <!-- Edges -->
  <line x1="325" y1="195" x2="415" y2="270" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="350" y="220" class="edge">long flex</text>

  <line x1="325" y1="290" x2="415" y2="295" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="345" y="280" class="edge">USB mic</text>

  <line x1="415" y1="330" x2="325" y2="385" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="340" y="370" class="edge">audio out</text>

  <line x1="685" y1="260" x2="775" y2="189" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="700" y="210" class="edge">UDP 5004 video</text>

  <line x1="685" y1="290" x2="775" y2="264" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="700" y="255" class="edge">UDP 5006 mic</text>

  <line x1="775" y1="414" x2="685" y2="320" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="700" y="380" class="edge">UDP 5008 TTS</text>

  <line x1="910" y1="218" x2="910" y2="235" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="910" y1="293" x2="910" y2="310" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="910" y1="368" x2="910" y2="385" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

  <path d="M 910 518 C 910 560 700 560 550 560 L 550 518" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="700" y="548" class="edge">share photo or video</text>

  <line x1="775" y1="489" x2="685" y2="489" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="700" y="478" class="edge">voice commands</text>

  <text x="40" y="595" class="tiny">Pi and powerbank stay in the pocket. Only the camera, mic, and earpiece ride on the glasses.</text>
</svg>
