<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-label="Jarbis voice assistant flow">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
    <style>
      .title { font: 700 26px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #0f172a; }
      .sub { font: 400 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #64748b; }
      .h { font: 700 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #0f172a; }
      .p { font: 400 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #475569; }
      .edge { font: 700 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #0f172a; }
      .foot { font: 400 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect width="1120" height="620" fill="#ffffff"/>
  <text x="40" y="42" class="title">Jarbis Voice Loop</text>
  <text x="40" y="68" class="sub">One spoken turn from mic input to earpiece reply</text>

  <!-- Step 1-4 evenly spaced -->
  <rect x="60" y="120" width="170" height="90" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="145" y="158" text-anchor="middle" class="h">1. Listen</text>
  <text x="145" y="182" text-anchor="middle" class="p">Pi mic + VAD</text>

  <line x1="230" y1="165" x2="270" y2="165" stroke="#0f172a" stroke-width="2.5" marker-end="url(#arrow2)"/>

  <rect x="270" y="120" width="170" height="90" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="355" y="158" text-anchor="middle" class="h">2. Record</text>
  <text x="355" y="182" text-anchor="middle" class="p">One utterance</text>

  <line x1="440" y1="165" x2="480" y2="165" stroke="#0f172a" stroke-width="2.5" marker-end="url(#arrow2)"/>

  <rect x="480" y="120" width="170" height="90" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="565" y="158" text-anchor="middle" class="h">3. Transcribe</text>
  <text x="565" y="182" text-anchor="middle" class="p">faster-whisper</text>

  <line x1="650" y1="165" x2="690" y2="165" stroke="#0f172a" stroke-width="2.5" marker-end="url(#arrow2)"/>

  <rect x="690" y="120" width="170" height="90" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="775" y="158" text-anchor="middle" class="h">4. Decide</text>
  <text x="775" y="182" text-anchor="middle" class="p">Command or chat?</text>

  <!-- Split down from Decide into two labeled branches -->
  <line x1="775" y1="210" x2="775" y2="270" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="250" y1="270" x2="980" y2="270" stroke="#0f172a" stroke-width="2.5"/>

  <!-- Left branch -->
  <line x1="250" y1="270" x2="250" y2="320" stroke="#0f172a" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <rect x="170" y="278" width="160" height="26" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="250" y="296" text-anchor="middle" class="edge">voice command</text>

  <rect x="130" y="320" width="240" height="110" rx="16" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="250" y="365" text-anchor="middle" class="h">KDE / Pi Action</text>
  <text x="250" y="390" text-anchor="middle" class="p">Photo, start recording,</text>
  <text x="250" y="410" text-anchor="middle" class="p">or stop and send</text>

  <!-- Right branch -->
  <line x1="980" y1="270" x2="980" y2="320" stroke="#0f172a" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <rect x="900" y="278" width="160" height="26" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="980" y="296" text-anchor="middle" class="edge">scene question</text>

  <rect x="860" y="320" width="240" height="110" rx="16" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="980" y="365" text-anchor="middle" class="h">Vision Chat</text>
  <text x="980" y="390" text-anchor="middle" class="p">Ollama llava-phi3 with</text>
  <text x="980" y="410" text-anchor="middle" class="p">latest camera frame</text>

  <!-- Merge to Speak -->
  <line x1="250" y1="430" x2="250" y2="470" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="980" y1="430" x2="980" y2="470" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="250" y1="470" x2="980" y2="470" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="615" y1="470" x2="615" y2="500" stroke="#0f172a" stroke-width="2.5" marker-end="url(#arrow2)"/>

  <rect x="530" y="500" width="170" height="80" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="615" y="534" text-anchor="middle" class="h">5. Speak</text>
  <text x="615" y="558" text-anchor="middle" class="p">TTS on UDP 5008</text>

  <!-- Repeat loop on far left, clear of cards -->
  <path d="M 530 540 H 48 V 165 H 60" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow2)"/>
  <rect x="58" y="330" width="70" height="26" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="93" y="348" text-anchor="middle" class="edge">repeat</text>

  <text x="40" y="600" class="foot">Barge-in is supported: talking over a reply can cancel TTS and start a new turn.</text>
</svg>
